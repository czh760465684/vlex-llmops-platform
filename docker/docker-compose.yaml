version: '3'
services:
  llomps-ui:
    image: llmops:0.9.9.9
    build:
      context: ../ui
      dockerfile: ./Dockerfile
    container_name: llmops-ui
    restart: always
    environment: [ ]
    ports:
      - "3000:3000"

  llmops-redis:
    image: redis:6-alpine
    container_name: llmops-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  llmops-postgres:
    image: postgres:15-alpine
    container_name: llmops-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data/pgdata
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  llmops-weaviate:
    image: semitechnologies/weaviate:1.28.4
    container_name: llmops-weaviate
    restart: always
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: false
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      AUTHENTICATION_APIKEY_ENABLED: true
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY}
      AUTHENTICATION_APIKEY_USERS: ${ADMIN_USER_EMAIL}
      AUTHORIZATION_ADMINLIST_ENABLED: true
      AUTHORIZATION_ADMINLIST_USERS: ${ADMIN_USER_EMAIL}
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - ./volumes/weaviate:/var/lib/weaviate

  llmops-api:
    image: llmops-api:0.9.9.9
    build:
      context: ../api
      dockerfile: ./Dockerfile
    container_name: llmops-api
    restart: always
    environment:
      # 模式为API，代表启用API服务
      MODE: api
      SERVER_WORKER_AMOUNT: 4
      SERVER_THREAD_AMOUNT: 4
      # 数据库迁移配置
      MIGRATION_ENABLED: 'true'
      # JWT加密秘钥
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # 服务配置
      SERVICE_IP: ${SERVICE_IP}
      SERVICE_API_PREFIX: ${SERVICE_API_PREFIX}
      # CSRF校验开关
      WTF_CSRF_ENABLED: 'false'
      # SQLAlchemy数据库配置
      SQLALCHEMY_DATABASE_URI: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@llmops-postgres:5432/llmops?client_encoding=utf8
      SQLALCHEMY_POOL_SIZE: 30
      SQLALCHEMY_POOL_RECYCLE: 3600
      SQLALCHEMY_ECHO: 'true'
      # Redis缓存数据库配置
      REDIS_HOST: llmops-redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ''
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      REDIS_USE_SSL: 'false'
      # Weaviate向量数据库配置
      WEAVIATE_HTTP_HOST: llmops-weaviate
      WEAVIATE_HTTP_PORT: 8080
      WEAVIATE_GRPC_HOST: llmops-weaviate
      WEAVIATE_GRPC_PORT: 50051
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
      # 腾讯云COS对象存储
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_REGION: ap-guangzhou
      COS_SCHEME: https
      COS_BUCKET: ${COS_BUCKET}
      COS_DOMAIN: ''

      # Celery异步队列任务配置
      CELERY_BROKER_DB: 1
      CELERY_RESULT_BACKEND_DB: 1
      CELERY_TASK_IGNORE_RESULT: 'true'
      CELERY_RESULT_EXPIRES: 3600
      CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: 'true'
      # Github OAuth应用秘钥
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}

      # LangSmith配置

      # HuggingFace配置

      # 辅助Agent智能体应用id标识
      ASSISTANT_AGENT_ID: 6774fcef-b594-8008-b30c-a05b8190afe6
      # OpenAI服务提供者
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: https://aihub.top/v1
      # DeepSeek服务提供者
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API_BASE: https://api.deepseek.com
      # 百度千帆服务提供者
      # 月之暗面服务提供者
      # 通义千问服务提供者
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      # 高德工具API秘钥
      GAODE_API_KEY: ${GAODE_API_KEY}
      # 谷歌Serper搜索API秘钥
      SERPER_API_KEY: ${SERPER_API_KEY}
    ports:
      - "5001:5001"
    volumes:
      - ./volumes/app/storage:/app/api/storage
    depends_on:
      - llmops-postgres
      - llmops-redis
      - llmops-weaviate


  llmops-celery:
    image: llmops-api:0.9.9.9
    build:
      context: ../api
      dockerfile: ./Dockerfile
    container_name: llmops-celery
    restart: always
    environment:
      # 模式为API，代表启用API服务
      MODE: celery
      SERVER_WORKER_AMOUNT: 1

      # 数据库迁移配置
      MIGRATION_ENABLED: 'false'
      # JWT加密秘钥
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # 服务配置
      SERVICE_IP: ${SERVICE_IP}
      SERVICE_API_PREFIX: ${SERVICE_API_PREFIX}
      # CSRF校验开关
      WTF_CSRF_ENABLED: 'false'
      # SQLAlchemy数据库配置
      SQLALCHEMY_DATABASE_URI: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@llmops-postgres:5432/llmops?client_encoding=utf8
      SQLALCHEMY_POOL_SIZE: 30
      SQLALCHEMY_POOL_RECYCLE: 3600
      SQLALCHEMY_ECHO: 'true'
      # Redis缓存数据库配置
      REDIS_HOST: llmops-redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ''
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      REDIS_USE_SSL: 'false'
      # Weaviate向量数据库配置
      WEAVIATE_HTTP_HOST: llmops-weaviate
      WEAVIATE_HTTP_PORT: 8080
      WEAVIATE_GRPC_HOST: llmops-weaviate
      WEAVIATE_GRPC_PORT: 50051
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
      # 腾讯云COS对象存储
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_REGION: ap-guangzhou
      COS_SCHEME: https
      COS_BUCKET: ${COS_BUCKET}
      COS_DOMAIN: ''

      # Celery异步队列任务配置
      CELERY_BROKER_DB: 1
      CELERY_RESULT_BACKEND_DB: 1
      CELERY_TASK_IGNORE_RESULT: 'true'
      CELERY_RESULT_EXPIRES: 3600
      CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: 'true'
      # Github OAuth应用秘钥
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}

      # LangSmith配置

      # HuggingFace配置

      # 辅助Agent智能体应用id标识
      ASSISTANT_AGENT_ID: 6774fcef-b594-8008-b30c-a05b8190afe6
      # OpenAI服务提供者
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: https://aihub.top/v1
      # DeepSeek服务提供者
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API_BASE: https://api.deepseek.com
      # 百度千帆服务提供者
      # 月之暗面服务提供者
      # 通义千问服务提供者
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      # 高德工具API秘钥
      GAODE_API_KEY: ${GAODE_API_KEY}
      # 谷歌Serper搜索API秘钥
      SERPER_API_KEY: ${SERPER_API_KEY}
    volumes:
      - ./volumes/app/storage:/app/api/storage
    depends_on:
      - llmops-postgres
      - llmops-redis
      - llmops-weaviate

  llmops-nginx:
    image: nginx:latest
    restart: always
    container_name: llmops-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/ssl
    depends_on:
      - llomps-ui
      - llmops-api
    ports:
      - "80:80"
      - "443:443"